version: '3.8'

services:
  backend:
    image: eulogio14/simulador-backend:latest
    container_name: simulador-ex-backend
    restart: on-failure
    env_file:
      - .env
    ports:
      - "80:8080"
    depends_on:
      - ocr
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      OCR_SERVICE_URL: http://ocr:8001
      AI_PROVIDER: gemini
      GEMINI_MODEL: gemini-3.5-flash
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/models
      MAIL_PORT: 587
    links:
      - ocr

  ocr:
    image: eulogio14/simulador-ocr:latest
    container_name: simulador-ex-ocr
    restart: on-failure

    ports:
      - "8001:8001"
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      SALIDA_DIR: /app/salidas
    volumes:
      - ocr-salidas:/app/salidas

volumes:
  ocr-salidas:
