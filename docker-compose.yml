version: '3.8'

services:
  backend:
    image: eulogio14/simulador-backend:latest
    container_name: simulador-ex-backend
    restart: on-failure
    ports:
      - "80:8080"
    depends_on:
      - ocr
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      OCR_SERVICE_URL: http://ocr:8001
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  ocr:
    image: eulogio14/simulador-ocr:latest
    container_name: simulador-ex-ocr
    restart: on-failure
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      SALIDA_DIR: /app/salidas
    volumes:
      - ocr-salidas:/app/salidas

volumes:
  ocr-salidas: