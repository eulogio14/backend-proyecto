name: CI/CD Pipeline - Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.multicontainer
          push: true
          tags: eulogio14/simulador-backend:latest

      - name: Crear paquete de despliegue (.zip)
        run: zip deploy.zip docker-compose.yml .env

      - name: Desplegar en AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          region: us-east-1
          application_name: simulador-ex-app
          environment_name: Simulador-ex-app-env
          version_label: "build-${{ github.sha }}"
          deployment_package: deploy.zip