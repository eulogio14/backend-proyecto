spring:
  application:
    name: proyecto-backend
  profiles:
    # Si no se especifica nada, arranca en modo 'dev'
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Configuraciones comunes para todos los entornos
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Necesario para subir varias capturas de WhatsApp al endpoint de OCR.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 100MB

jwt:
  access-token-expiration-ms: 86400000
  refresh-token-expiration-ms: 604800000

# Microservicio Python de OCR (proyect-script/server.py)
ocr:
  service:
    url: ${OCR_SERVICE_URL:http://localhost:8001}

# API de IA para imitar al Ex.
# - Gemini: define GEMINI_API_KEY
# - Groq/OpenAI: define AI_API_KEY (o GROQ_API_KEY) y opcionalmente AI_BASE_URL / AI_MODEL
# Si no hay ninguna clave, se usa la heurística local sin gastar tokens.
ia:
  provider: ${AI_PROVIDER:}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
  gemini-model: ${GEMINI_MODEL:gemini-3.5-flash}
  openai-api-key: ${AI_API_KEY:${GROQ_API_KEY:}}
  openai-base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  openai-model: ${AI_MODEL:llama-3.3-70b-versatile}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:150}
  temperature: ${AI_TEMPERATURE:0.8}
  dataset-max-chars: ${AI_DATASET_MAX_CHARS:6000}
  history-max-messages: ${AI_HISTORY_MAX_MESSAGES:12}
